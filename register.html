<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - IT Help Desk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="navbar">

        <div class="logo">
            <span>IT</span> Help Desk
        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    IT
                </div>

                <h1>Create Account</h1>

                <p>
                    Register to access the IT Help Desk system
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option value="">
                            Select department
                        </option>

                        <option value="CSE">
                            Computer Science and Engineering
                        </option>

                        <option value="ECE">
                            Electronics and Communication
                        </option>

                        <option value="EEE">
                            Electrical and Electronics
                        </option>

                        <option value="MECH">
                            Mechanical
                        </option>

                        <option value="CIVIL">
                            Civil
                        </option>

                        <option value="HR">
                            Human Resources
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Administration">
                            Administration
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <div id="registerMessage"></div>


            <div class="auth-footer">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/main.js"></script>

</body>
</html>
